<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOM 物料清单自检工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      color: #333;
      line-height: 1.6;
    }

    .hidden {
      display: none !important;
    }

    .container {
      display: flex;
      height: 100vh;
      padding: 20px;
      gap: 20px;
    }

    .panel {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .left-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .left-panel > h2,
    .left-panel > .upload-area,
    .left-panel > .loading,
    .left-panel > .error-message,
    .left-panel > .sheets-info {
      flex-shrink: 0;
      margin-bottom: 15px;
    }

    .sheets-list {
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 10px;
    }

    .left-panel .table-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .left-panel .table-container {
      flex: 1;
      overflow: auto;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }

    .left-panel .pagination {
      flex-shrink: 0;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e0e0e0;
    }

    .right-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .right-panel > h2,
    .right-panel > .error-summary,
    .right-panel > .success-summary {
      flex-shrink: 0;
    }

    .right-panel .error-table-container {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    .right-panel > .pagination {
      flex-shrink: 0;
    }

    h2 {
      color: #1976d2;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .upload-area {
      border: 1px solid #1976d2;
      border-radius: 4px;
      padding: 15px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .upload-area:hover {
      background: #f5f9ff;
      border-color: #1565c0;
    }

    .upload-area.dragover {
      background: #e3f2fd;
      border-color: #0d47a1;
    }

    .upload-icon {
      font-size: 24px;
      color: #1976d2;
    }

    .upload-text {
      color: #666;
    }

    .upload-text strong {
      color: #1976d2;
    }

    .file-input {
      display: none;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #1976d2;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #1976d2;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .table-container {
      overflow: auto;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }

    .sheets-list {
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 10px;
    }

    .error-table-container {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
      min-width: 100px;
    }

    th {
      background: #f5f9ff;
      color: #1976d2;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    tr:hover {
      background: #f5f9ff;
    }

    .highlight-row {
      background: #fff3cd !important;
      animation: highlight-fade 3s forwards;
    }

    @keyframes highlight-fade {
      0% { background: #fff3cd; }
      100% { background: #f5f9ff; }
    }

    .error-summary {
      background: #ffebee;
      border: 1px solid #ef5350;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .error-summary.active {
      display: block;
    }

    .error-count {
      font-size: 24px;
      font-weight: bold;
      color: #c62828;
    }

    .error-table-container {
      flex: 1;
      overflow: auto;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      min-height: 300px;
    }

    .sheets-info {
      margin-bottom: 20px;
    }

    .sheets-info h3 {
      color: #1976d2;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .sheets-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sheet-item {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 13px;
      color: #333;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sheet-item:hover {
      border-color: #1976d2;
      background: #f5f9ff;
      cursor: pointer;
    }

    .sheet-item.has-errors {
      border-color: #ef5350;
      background: #ffebee;
    }

    .sheet-item.has-errors:hover {
      background: #ffcdd2;
    }

    .sheet-item .sheet-name {
      font-weight: 600;
      white-space: nowrap;
    }

    .sheet-item .sheet-rows {
      font-size: 12px;
      color: #666;
    }

    .sheet-item .error-count {
      font-size: 12px;
      color: #c62828;
      font-weight: 500;
      background: rgba(198, 40, 40, 0.1);
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .sheet-item .success-mark {
      color: #4caf50;
      font-size: 14px;
      margin-left: 4px;
    }

    .table-header {
      margin-bottom: 10px;
    }

    .sheet-select {
      padding: 8px 12px;
      border: 1px solid #1976d2;
      border-radius: 4px;
      font-size: 14px;
      color: #333;
      background: #fff;
      cursor: pointer;
    }

    .sheet-select:focus {
      outline: none;
      border-color: #1565c0;
    }

    .success-summary {
      background: #e8f5e9;
      border: 1px solid #4caf50;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      margin-top: 20px;
    }

    .success-icon {
      font-size: 48px;
      color: #4caf50;
      margin-bottom: 10px;
    }

    .success-text {
      font-size: 18px;
      color: #2e7d32;
      font-weight: 500;
    }

    .error-row {
      cursor: pointer;
      transition: background 0.2s;
    }

    .error-row:hover {
      background: #ffebee;
    }

    .error-cell {
      color: #c62828;
    }

    .btn {
      background: #1976d2;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #1565c0;
    }

    .btn:disabled {
      background: #bdbdbd;
      cursor: not-allowed;
    }

    .btn-export {
      margin-top: 15px;
      align-self: flex-start;
    }

    .hidden {
      display: none;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e0e0e0;
    }

    .page-btn {
      background: #fff;
      border: 1px solid #1976d2;
      color: #1976d2;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .page-btn:hover:not(:disabled) {
      background: #f5f9ff;
    }

    .page-btn:disabled {
      border-color: #bdbdbd;
      color: #bdbdbd;
      cursor: not-allowed;
    }

    .page-info {
      font-size: 13px;
      color: #666;
    }

    .error-message {
      background: #ffebee;
      border: 1px solid #ef5350;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      color: #c62828;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel left-panel">
      <h2>文件上传</h2>
      
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">&#128193;</div>
        <div class="upload-text">
          上传 .xlsx 或 .xls 文件 <strong>点击选择</strong>
          &nbsp;&nbsp;|&nbsp;&nbsp; 大小限制：10MB
        </div>
        <input type="file" class="file-input" id="fileInput" accept=".xlsx,.xls">
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>正在处理文件...</div>
      </div>

      <div class="error-message hidden" id="errorMessage"></div>

      <div class="sheets-info hidden" id="sheetsInfo">
        <h3>Sheet 列表</h3>
        <div class="sheets-list" id="sheetsList"></div>
      </div>

      <div class="table-wrapper hidden" id="tableWrapper">
        <div class="table-container" id="tableContainer">
          <div class="table-header">
            <select id="sheetSelect" class="sheet-select"></select>
          </div>
          <table id="previewTable">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="pagination" id="pagination">
          <button class="page-btn" id="prevBtn">上一页</button>
          <span class="page-info" id="pageInfo"></span>
          <button class="page-btn" id="nextBtn">下一页</button>
        </div>
      </div>
    </div>

    <div class="panel right-panel">
      <h2>校验结果</h2>
      
      <div class="error-summary hidden" id="errorSummary">
        <div class="error-count" id="errorCount"></div>
        <div id="errorDesc"></div>
      </div>

      <div class="success-summary hidden" id="successSummary">
        <div class="success-icon">✓</div>
        <div class="success-text">校验通过，未发现任何问题</div>
      </div>

      <div class="error-table-container hidden" id="errorTableContainer" style="max-height: 400px; overflow-y: auto;">
         <table id="errorTable">
          <thead>
            <tr>
              <th>行号</th>
              <th>Sheet</th>
              <th>问题字段</th>
              <th>原始内容</th>
              <th>错误描述</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="pagination hidden" id="errorPagination">
        <button class="page-btn" id="errorPrevBtn">上一页</button>
        <span class="page-info" id="errorPageInfo"></span>
        <button class="page-btn" id="errorNextBtn">下一页</button>
      </div>

      <button class="btn btn-export hidden" id="exportBtn">导出错误报告</button>
    </div>
  </div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const loading = document.getElementById('loading');
    const tableWrapper = document.getElementById('tableWrapper');
    const tableContainer = document.getElementById('tableContainer');
    const previewTable = document.getElementById('previewTable');
    const sheetsInfo = document.getElementById('sheetsInfo');
    const sheetsList = document.getElementById('sheetsList');
    const sheetSelect = document.getElementById('sheetSelect');
    const errorSummary = document.getElementById('errorSummary');
    const errorCount = document.getElementById('errorCount');
    const errorDesc = document.getElementById('errorDesc');
    const errorTableContainer = document.getElementById('errorTableContainer');
    const errorTable = document.getElementById('errorTable');
    const exportBtn = document.getElementById('exportBtn');
    const errorMessage = document.getElementById('errorMessage');
    const pagination = document.getElementById('pagination');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageInfo = document.getElementById('pageInfo');
    const errorPagination = document.getElementById('errorPagination');
    const errorPrevBtn = document.getElementById('errorPrevBtn');
    const errorNextBtn = document.getElementById('errorNextBtn');
    const errorPageInfo = document.getElementById('errorPageInfo');
    const successSummary = document.getElementById('successSummary');

    let currentData = [];
    let currentHeaders = [];
    let currentErrors = [];
    let allSheetsData = {};
    let allSheetsErrors = {};
    let currentSheet = '';
    let currentHeaderRowIndex = 0;
    let currentPage = 1;
    let errorPage = 1;
    const rowsPerPage = 100;
    const errorsPerPage = 50;

    uploadArea.addEventListener('click', () => fileInput.click());

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFile(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    async function handleFile(file) {
      if (!file.name.endsWith('.xlsx') && !file.name.endsWith('.xls')) {
        showError('只支持 .xlsx 和 .xls 格式的文件');
        return;
      }

      if (file.size > 10 * 1024 * 1024) {
        showError('文件大小超过 10MB 限制');
        return;
      }

      showLoading(true);
      hideError();
      resetDisplay();

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (!response.ok) {
          showError(result.error || '文件处理失败');
          return;
        }

        allSheetsData = {};
        allSheetsErrors = {};
        
        result.sheets.forEach(sheet => {
          const sheetName = sheet.name;
          allSheetsData[sheetName] = {
            headers: sheet.headers || [],
            data: sheet.data || [],
            headerRowIndex: sheet.headerRowIndex || 0
          };
          allSheetsErrors[sheetName] = sheet.errors || [];
        });

        if (result.sheets.length === 0) {
          showError('文件中没有可识别的 sheet');
          return;
        }

        const firstValidSheet = result.sheets.find(s => s.headers && s.headers.length > 0) || result.sheets[0];
        currentSheet = firstValidSheet.name;
        currentHeaders = firstValidSheet.headers || [];
        currentData = firstValidSheet.data || [];
        currentErrors = allSheetsErrors[currentSheet] || [];
        currentHeaderRowIndex = allSheetsData[currentSheet].headerRowIndex;

        displaySheetsInfo(result.sheets);
        displaySheetSelect(result.sheets.map(s => s.name));
        
        
        displayTable();
        displayErrors();
        displayPagination();

        if (currentErrors.length > 0) {
          exportBtn.classList.remove('hidden');
        }

      } catch (error) {
        showError('文件处理失败：' + error.message);
      } finally {
        showLoading(false);
      }
    }

    function showLoading(show) {
      loading.classList.toggle('active', show);
      uploadArea.classList.toggle('hidden', show);
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.remove('hidden');
      showLoading(false);
    }

    function hideError() {
      errorMessage.classList.add('hidden');
    }

    function resetDisplay() {
      tableWrapper.classList.add('hidden');
      tableContainer.classList.add('hidden');
      sheetsInfo.classList.add('hidden');
      errorSummary.classList.add('hidden');
      successSummary.classList.add('hidden');
      errorTableContainer.classList.add('hidden');
      errorPagination.classList.add('hidden');
      exportBtn.classList.add('hidden');
      allSheetsData = {};
      allSheetsErrors = {};
      currentData = [];
      currentHeaders = [];
      currentErrors = [];
      currentSheet = '';
      currentPage = 1;
      errorPage = 1;
    }

    function displaySheetsInfo(sheets) {
      if (sheets.length === 0) {
        sheetsInfo.classList.add('hidden');
        return;
      }

      sheetsInfo.classList.remove('hidden');
      sheetsList.innerHTML = sheets.map(s => {
        const errorCount = (s.errors || []).length;
        const hasErrors = errorCount > 0;
        const errorTag = hasErrors 
          ? `<span class="error-count">${errorCount} 个错误</span>` 
          : `<span class="success-mark">✓</span>`;
        
        return `<div class="sheet-item ${hasErrors ? 'has-errors' : ''}" data-sheet="${s.name}">
          <span class="sheet-name">${s.name}</span>
          <span class="sheet-rows">${s.rows} 行</span>
          <span style="font-size:10px;color:#999;">表头行：${s.headerRowIndex + 1}</span>
          ${errorTag}
        </div>`;
      }).join('');

      // 添加点击切换 sheet 功能
      sheetsList.querySelectorAll('.sheet-item').forEach(item => {
        item.addEventListener('click', () => {
          const sheetName = item.getAttribute('data-sheet');
          sheetSelect.value = sheetName;
          currentSheet = sheetName;
          const sheetData = allSheetsData[sheetName];
          currentHeaders = sheetData.headers;
          currentData = sheetData.data;
          currentHeaderRowIndex = sheetData.headerRowIndex;
          currentErrors = allSheetsErrors[sheetName] || [];
          currentPage = 1;
          errorPage = 1;
          displayTable();
          displayErrors();
          displayPagination();
        });
      });
    }

    function displaySheetSelect(sheetNames) {
      sheetSelect.innerHTML = sheetNames.map(name => 
        `<option value="${name}">${name}</option>`
      ).join('');
      
      sheetSelect.value = currentSheet;
      
      sheetSelect.onchange = () => {
        currentSheet = sheetSelect.value;
        const sheetData = allSheetsData[sheetSelect.value];
        currentHeaders = sheetData.headers;
        currentData = sheetData.data;
        currentHeaderRowIndex = sheetData.headerRowIndex;
        currentErrors = allSheetsErrors[sheetSelect.value] || [];
        currentPage = 1;
        errorPage = 1;
        displayTable();
        displayErrors();
        displayPagination();
      };
    }

    function displayTable() {
      tableWrapper.classList.remove('hidden');

      const thead = previewTable.querySelector('thead');
      const tbody = previewTable.querySelector('tbody');

      // 添加行号列标题
      thead.innerHTML = '<tr><th style="width:40px;background:#f5f5f5;">#</th>' + currentHeaders.map(h => `<th>${h}</th>`).join('') + '</tr>';

      renderTablePage();
    }

    function renderTablePage() {
      const tbody = previewTable.querySelector('tbody');
      const start = (currentPage - 1) * rowsPerPage;
      const end = Math.min(start + rowsPerPage, currentData.length);
      const pageData = currentData.slice(start, end);

      // 构建错误行号集合，用于快速查找
      const errorRowSet = new Set(currentErrors.map(e => e.row));

      tbody.innerHTML = pageData.map((row, rowIndex) => {
        const globalRow = start + rowIndex;
        // 计算实际 Excel 行号：数据索引 + 表头索引 + 2
        // rowIndex=0 时，globalRow=0, actualRowNum = 0 + headerRowIndex + 2 = headerRowIndex + 2
        const actualRowNum = globalRow + currentHeaderRowIndex + 2;
        const hasError = errorRowSet.has(actualRowNum);
        const rowClass = hasError ? 'style="cursor: pointer; background: #fff3cd;"' : '';
        
        // 在每行前面添加行号显示
        return '<tr ' + rowClass + ' data-row="' + actualRowNum + '">' +
          `<td style="background:#f5f5f5;color:#666;font-weight:bold;width:40px;text-align:center;">${actualRowNum}</td>` +
          row.map(cell => `<td>${cell || ''}</td>`).join('') +
          '</tr>';
      }).join('');

      tbody.querySelectorAll('tr').forEach(tr => {
        tr.addEventListener('click', () => {
          const rowNum = parseInt(tr.getAttribute('data-row'));
          highlightRow(rowNum);
        });
      });
    }

    function getSheetErrors(sheetName) {
      return allSheetsErrors[sheetName] || [];
    }

    function getAllErrors() {
      let allErrors = [];
      for (const sheetName of Object.keys(allSheetsErrors)) {
        const errors = allSheetsErrors[sheetName] || [];
        allErrors = allErrors.concat(errors.map(e => ({ ...e, sheet: sheetName })));
      }
      return allErrors;
    }

    function displayErrors() {
      const allErrors = getAllErrors();
      const sheetErrors = getSheetErrors(currentSheet);
      
      // 如果没有任何错误
      if (allErrors.length === 0) {
        errorSummary.classList.add('hidden');
        errorTableContainer.classList.add('hidden');
        errorPagination.classList.add('hidden');
        exportBtn.classList.add('hidden');
        successSummary.classList.remove('hidden');
        return;
      }

      successSummary.classList.add('hidden');
      errorTableContainer.classList.remove('hidden');

      const affectedRows = new Set(allErrors.map(e => e.row));
      
      // 显示总错误数，但错误列表只显示当前sheet的
      errorCount.textContent = `共 ${allErrors.length} 项问题`;
      errorDesc.textContent = `涉及 ${affectedRows.size} 行数据`;
      errorSummary.classList.remove('hidden');
      
      currentErrors = sheetErrors;
      errorPage = 1;
      renderErrorPage();
      displayErrorPagination();

      if (allErrors.length > 0) {
        exportBtn.classList.remove('hidden');
      }

      const tbody = errorTable.querySelector('tbody');
      tbody.querySelectorAll('.error-row').forEach(tr => {
        tr.addEventListener('click', () => {
          const rowNum = parseInt(tr.getAttribute('data-row'));
          const sheetName = tr.getAttribute('data-sheet');
          if (sheetName && sheetName !== currentSheet) {
            currentSheet = sheetName;
            const sheetData = allSheetsData[sheetName];
            currentHeaders = sheetData.headers;
            currentData = sheetData.data;
            currentHeaderRowIndex = sheetData.headerRowIndex;
            currentErrors = allSheetsErrors[sheetName] || [];
            displayTable();
            displayPagination();
          }
          highlightRow(rowNum);
        });
      });
    }

    function displaySheetsInfo(sheets) {
      if (sheets.length === 0) {
        sheetsInfo.classList.add('hidden');
        return;
      }

      sheetsInfo.classList.remove('hidden');
      
      // 计算总错误数
      const totalErrorCount = sheets.reduce((sum, s) => sum + (s.errors || []).length, 0);
      
      sheetsList.innerHTML = sheets.map(s => {
        const errorCount = (s.errors || []).length;

        return `<div class="sheet-item ${hasErrors ? 'has-errors' : ''}" data-sheet="${s.name}">

          <span class="sheet-rows">${s.rows} 行</span>
          <span style="font-size:10px;color:#999;">表头行：${s.headerRowIndex + 1}</span>

      }).join('');

      sheetsList.querySelectorAll('.sheet-item').forEach(item => {
        item.addEventListener('click', () => {
          const sheetName = item.getAttribute('data-sheet');
          sheetSelect.value = sheetName;
          currentSheet = sheetName;
          const sheetData = allSheetsData[sheetName];
          currentHeaders = sheetData.headers;
          currentData = sheetData.data;
          currentHeaderRowIndex = sheetData.headerRowIndex;
          currentErrors = allSheetsErrors[sheetName] || [];
          currentPage = 1;
          errorPage = 1;
          displayTable();
          displayErrors();
          displayPagination();
        });
      });
    }

      successSummary.classList.add('hidden');
      errorTableContainer.classList.remove('hidden');

      const affectedRows = new Set(currentErrors.map(e => e.row));
      
      errorCount.textContent = `${currentSheet}: ${currentErrors.length} 项问题`;
      errorDesc.textContent = `涉及 ${affectedRows.size} 行数据`;
      errorSummary.classList.remove('hidden');
      
      renderErrorPage();
      displayErrorPagination();

      if (currentErrors.length > 0) {
        exportBtn.classList.remove('hidden');
      }

      tbody.querySelectorAll('.error-row').forEach(tr => {
        tr.addEventListener('click', () => {
          const rowNum = parseInt(tr.getAttribute('data-row'));
          highlightRow(rowNum);
        });
      });
    }

    function renderErrorPage() {
      const tbody = errorTable.querySelector('tbody');
      const allErrors = getAllErrors();
      const start = (errorPage - 1) * errorsPerPage;
      const end = Math.min(start + errorsPerPage, allErrors.length);
      const pageErrors = allErrors.slice(start, end);

      tbody.innerHTML = pageErrors.map(err => 
        `<tr class="error-row" data-row="${err.row}" data-sheet="${err.sheet || currentSheet}">
          <td>${err.row}</td>
          <td>${escapeHtml(String(err.sheet || ''))}</td>
          <td class="error-cell">${err.field}</td>
          <td>${escapeHtml(String(err.value))}</td>
          <td class="error-cell">${err.error}</td>
        </tr>`
      ).join('');
    }

    function displayErrorPagination() {
      const totalPages = Math.ceil(getAllErrors().length / errorsPerPage);
      
      if (totalPages <= 1) {
        errorPagination.classList.add('hidden');
        return;
      }

      errorPagination.classList.remove('hidden');
      errorPrevBtn.disabled = errorPage === 1;
      errorNextBtn.disabled = errorPage === totalPages;
      errorPageInfo.textContent = `第 ${errorPage} / ${totalPages} 页`;
    }

    function displayPagination() {
      if (currentData.length === 0) {
        pagination.classList.add('hidden');
        return;
      }

      pagination.classList.remove('hidden');
      const totalPages = Math.ceil(currentData.length / rowsPerPage);
      
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages;
      pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;
    }

    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderTablePage();
        displayPagination();
      }
    });

    nextBtn.addEventListener('click', () => {
      const totalPages = Math.ceil(currentData.length / rowsPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        renderTablePage();
        displayPagination();
      }
    });

    errorPrevBtn.addEventListener('click', () => {
      if (errorPage > 1) {
        errorPage--;
        renderErrorPage();
        displayErrorPagination();
      }
    });

    errorNextBtn.addEventListener('click', () => {
      const totalPages = Math.ceil(currentErrors.length / errorsPerPage);
      if (errorPage < totalPages) {
        errorPage++;
        renderErrorPage();
        displayErrorPagination();
      }
    });

    function highlightRow(rowNum) {
      const rows = previewTable.querySelectorAll('tbody tr');
      rows.forEach(row => {
        row.classList.remove('highlight-row');
        if (parseInt(row.getAttribute('data-row')) === rowNum) {
          row.classList.add('highlight-row');
          row.scrollIntoView({ behavior: 'smooth', block: 'center' });
          
          setTimeout(() => {
            row.classList.remove('highlight-row');
          }, 3000);
        }
      });

      const totalRows = currentData.length;
      const targetPage = Math.ceil(rowNum / rowsPerPage);
      if (targetPage !== currentPage && targetPage >= 1) {
        currentPage = targetPage;
        renderTablePage();
        displayPagination();
        
        setTimeout(() => {
          const row = previewTable.querySelector(`tbody tr[data-row="${rowNum}"]`);
          if (row) {
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 100);
      }
    }

    exportBtn.addEventListener('click', async () => {
      try {
        const response = await fetch('/api/export', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            headers: currentHeaders,
            data: currentData,
            errors: currentErrors
          })
        });

        if (!response.ok) {
          throw new Error('导出失败');
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'bom-check-result.xlsx';
        a.click();
        window.URL.revokeObjectURL(url);
      } catch (error) {
        alert('导出失败：' + error.message);
      }
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

          { heading: '注塑 / 成型工艺', rules: [
            { t: 'formula', x: '前提：表四工艺流程包含「成型」或「注塑」。校验：生产周期 ≈ (注塑周期 / 模穴数 / 60) × 1.1。' },
            { t: 'logic', x: '工艺流程含「成型 / 注塑」时，模穴数与注塑周期必须填写，且 SPM 不能填写。' }
          ]},
          { heading: '电镀工艺', rules: [
            { t: 'formula', x: '前提：表四工艺流程包含「电镀」。校验：生产周期 ≈ [1 / (电镀产速 × 1000 / 步距)] × 1.05（允差 max(5%, 0.01)）。' },
            { t: 'logic', x: '工艺流程含「电镀」时，电镀产速与步距必须填写，且 SPM 不能填写。' }
          ]}
        ]
      }
    ];

    function countRules(cat) {
      return cat.sections.reduce(function (sum, s) { return sum + s.rules.length; }, 0);
    }

    var css = [
      '.rules-fab{position:fixed;top:16px;right:16px;z-index:9998;display:flex;align-items:center;gap:8px;background:#102a43;color:#fff;border:none;padding:10px 16px;border-radius:24px;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(16,42,67,.3);transition:all .2s}',
      '.rules-fab:hover{background:#1b3a5c;transform:translateY(-1px)}',
      '.rules-fab svg{display:block}',
      '.rules-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9999;display:none;align-items:center;justify-content:center;padding:24px}',
      '.rules-overlay.open{display:flex}',
      '.rules-modal{width:min(1180px,100%);height:min(860px,100%);background:#fff;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35)}',
      '.rules-modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:#102a43;color:#fff;flex-shrink:0}',
      '.rules-modal-head h2{font-size:18px;font-weight:700}',
      '.rules-modal-head p{font-size:12px;color:#9fb3c8;margin-top:2px}',
      '.rules-close{background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:8px;font-size:20px;cursor:pointer;line-height:1}',
      '.rules-close:hover{background:rgba(255,255,255,.24)}',
      '.rules-body{flex:1;display:flex;min-height:0}',
      '.rules-nav{width:210px;flex-shrink:0;border-right:1px solid #e5e9f0;padding:14px 10px;overflow:auto;background:#f8fafc}',
      '.rules-nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:transparent;border:none;padding:10px 12px;border-radius:8px;font-size:14px;color:#334155;cursor:pointer;margin-bottom:4px}',
      '.rules-nav-item:hover{background:#eef2f7}',
      '.rules-nav-item.active{background:#102a43;color:#fff;font-weight:600}',
      '.rules-nav-count{font-size:11px;background:rgba(0,0,0,.08);padding:1px 7px;border-radius:10px}',
      '.rules-nav-item.active .rules-nav-count{background:rgba(255,255,255,.25)}',
      '.rules-main{flex:1;min-width:0;overflow:auto;padding:20px 24px}',
      '.rules-toolbar{margin-bottom:16px}',
      '.rules-search{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box}',
      '.rules-search:focus{border-color:#1976d2}',
      '.rules-title{font-size:17px;font-weight:700;color:#102a43}',
      '.rules-subtitle{font-size:13px;color:#64748b;margin:4px 0 16px}',
      '.rules-section{margin-bottom:20px}',
      '.rules-section-head{font-size:14.5px;font-weight:700;color:#102a43;margin-bottom:10px;padding-left:10px;border-left:4px solid #1976d2}',
      '.rules-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}',
      '.rule-card{border:1px solid #e5e9f0;border-left-width:4px;border-radius:8px;padding:12px 14px;background:#fff;display:flex;gap:10px;align-items:flex-start}',
      '.rule-card .rule-tag{flex-shrink:0;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;margin-top:1px}',
      '.rule-card .rule-text{font-size:13.5px;color:#334155;line-height:1.6;word-break:break-word}',
      '.rules-empty{color:#94a3b8;text-align:center;padding:48px;font-size:14px}',
      '.rules-group-label{font-size:13px;font-weight:700;color:#e65100;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px dashed #e2e8f0}'
    ].join('');

    var styleEl = document.createElement('style');
    styleEl.textContent = css;
    document.head.appendChild(styleEl);

    function el(tag, cls, html) {
      var node = document.createElement(tag);
      if (cls) node.className = cls;
      if (html !== undefined) node.innerHTML = html;
      return node;
    }

    function card(rule) {
      var meta = RULE_TYPES[rule.t] || RULE_TYPES.logic;
      var c = el('div', 'rule-card');
      c.style.borderLeftColor = meta.color;
      var tag = el('span', 'rule-tag', meta.label);
      tag.style.color = meta.color;
      tag.style.background = meta.bg;
      var txt = el('span', 'rule-text');
      txt.textContent = rule.x;
      c.appendChild(tag);
      c.appendChild(txt);
      return c;
    }

    var fab = el('button', 'rules-fab');
    fab.type = 'button';
    fab.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"></path><line x1="8" y1="7" x2="15" y2="7"></line><line x1="8" y1="11" x2="15" y2="11"></line></svg><span>校验规则</span>';
    document.body.appendChild(fab);

    var overlay = el('div', 'rules-overlay');
    var modal = el('div', 'rules-modal');
    var head = el('div', 'rules-modal-head');
    var headText = el('div', '', '<h2>BOM 校验规则总览</h2><p>全五张表的字段要求、枚举值、联动逻辑与跨表公式</p>');
    var closeBtn = el('button', 'rules-close', '&times;');
    closeBtn.type = 'button';
    head.appendChild(headText);
    head.appendChild(closeBtn);

    var body = el('div', 'rules-body');
    var nav = el('div', 'rules-nav');
    var main = el('div', 'rules-main');

    var toolbar = el('div', 'rules-toolbar');
    var search = el('input', 'rules-search');
    search.type = 'text';
    search.placeholder = '搜索规则关键词，例如：废品率、SPM、外协、枚举...';
    toolbar.appendChild(search);

    var content = el('div');
    main.appendChild(toolbar);
    main.appendChild(content);

    body.appendChild(nav);
    body.appendChild(main);
    modal.appendChild(head);
    modal.appendChild(body);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    var navButtons = {};
    RULES.forEach(function (cat) {
      var btn = el('button', 'rules-nav-item');
      btn.type = 'button';
      btn.appendChild(el('span', '', cat.label));
      btn.appendChild(el('span', 'rules-nav-count', String(countRules(cat))));
      btn.addEventListener('click', function () { selectCategory(cat.id); });
      nav.appendChild(btn);
      navButtons[cat.id] = btn;
    });

    function renderCategory(cat) {
      content.innerHTML = '';
      content.appendChild(el('div', 'rules-title', cat.title));
      content.appendChild(el('div', 'rules-subtitle', cat.desc));
      cat.sections.forEach(function (section) {
        var sec = el('div', 'rules-section');
        sec.appendChild(el('div', 'rules-section-head', section.heading));
        var list = el('div', 'rules-list');
        section.rules.forEach(function (rule) { list.appendChild(card(rule)); });
        sec.appendChild(list);
        content.appendChild(sec);
      });
    }

    function selectCategory(id) {
      RULES.forEach(function (cat) {
        navButtons[cat.id].classList.toggle('active', cat.id === id);
      });
      var cat = RULES.filter(function (c) { return c.id === id; })[0];
      if (cat) renderCategory(cat);
    }

    function renderSearch(query) {
      var q = query.trim().toLowerCase();
      content.innerHTML = '';
      if (!q) {
        selectCategory(RULES[0].id);
        return;
      }
      RULES.forEach(function (cat) { navButtons[cat.id].classList.remove('active'); });
      var total = 0;
      RULES.forEach(function (cat) {
        var groups = [];
        cat.sections.forEach(function (section) {
          var hits = section.rules.filter(function (rule) {
            return rule.x.toLowerCase().indexOf(q) !== -1;
          });
          if (hits.length) groups.push({ heading: section.heading, rules: hits });
        });
        var groupTotal = groups.reduce(function (s, g) { return s + g.rules.length; }, 0);
        if (!groupTotal) return;
        total += groupTotal;
        content.appendChild(el('div', 'rules-group-label', cat.title + '（' + groupTotal + ' 条）'));
        groups.forEach(function (g) {
          var sec = el('div', 'rules-section');
          sec.appendChild(el('div', 'rules-section-head', g.heading));
          var list = el('div', 'rules-list');
          g.rules.forEach(function (rule) { list.appendChild(card(rule)); });
          sec.appendChild(list);
          content.appendChild(sec);
        });
      });
      if (!total) content.appendChild(el('div', 'rules-empty', '未找到匹配的规则'));
    }

    search.addEventListener('input', function () { renderSearch(search.value); });

    function openModal() {
      overlay.classList.add('open');
      search.value = '';
      selectCategory(RULES[0].id);
    }
    function closeModal() {
      overlay.classList.remove('open');
    }

    fab.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
    });
  })();
  </script>
</body>
</html>
